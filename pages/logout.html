<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">

            <div class="w-20 h-20 mx-auto mb-4 bg-blue-100 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-blue-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1" />
                </svg>
            </div>

            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                Log Out?
            </h2>

            <p class="text-gray-500 mb-6">
                Are you sure you want to log out of your account?
                You will need to sign in again to access your dashboard.
            </p>

            <div class="flex gap-4">
                <button class="flex-1 py-3 border border-gray-300 rounded-lg hover:bg-gray-100">
                    Cancel
                </button>

                <button onclick="logout()" class="flex-1 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                    Log Out
                </button>
            </div>
        </div>
    </div>
    <!-- js -->
    <script>
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "../index.html";
        }
    </script>
</body>

</html>
