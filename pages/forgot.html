<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Forgot Password - CivicReport</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- Card -->
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
        <!-- logo-->
        <div class="items-center text-center text-white gap-2 mb-8 text-blue-600">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-lg mb-3">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
            <p class="text-gray-500 text-sm mt-1">Enter your email to reset your password</p>
        </div>

        <!-- enter email -->
        <form id="forgotForm" class="space-y-5">
            <div id="step1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </span>
                    <input type="email" id="resetEmail" placeholder="Enter your registered email"
                        class="w-full pl-10 pr-4 py-2.5 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <button type="button" id="checkEmailBtn"
                    class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition">
                    Continue
                </button>
            </div>

            <!-- Step 2: Reset Password - Hidden by default -->
            <div id="step2" class="hidden space-y-5">
                <p class="text-sm text-green-600 bg-green-50 p-2 rounded-lg">Account found! Set a new password.</p>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 8 characters"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password"
                        class="w-full px-4 py-2.5 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition">
                    Reset Password
                </button>
            </div>
        </form>

        <!-- Back to Login -->
        <p class="text-center text-sm text-gray-500 mt-6">
            Remember your password?
            <a href="../pages/admin-login.html" class="text-blue-600 font-medium hover:underline">Back to Login</a>
        </p>
    </div>

    <script src="../js/forgot .js"></script>
</body>

</html>
